function st(p){const L=S.log.filter(x=>x.p==p),n=L.length,ok=L.filter(x=>x.ok).length,c={};

function coach(p){const s=st(p),n=P[p].n,o=[];
if(!s.n)return[`${n}、まずは野球IQチャレンジを5問やってみよう。記録がたまると、くわしいアドバイスができるよ。`];
if(s.weak&&s.weak[1]<.8)o.push(`最近は「${s.weak[0]}」の正答率が${Math.round(s.weak[1]*100)}%。次のチャレンジでは「${s.weak[0]}」の問題を多めに出すよ。`);
if(s.strong&&s.strong[1]>=.8)o.push(`「${s.strong[0]}」は正答率${Math.round(s.strong[1]*100)}%で得意になってきたね。`);
if(s.s>=2)o.push(`${s.s}日連続でがんばれているね。`);
const bad=[...new Set(s.L.filter(x=>!x.ok).map(x=>x.q))].filter(q=>{const h=s.L.filter(x=>x.q==q);return!h[h.length-1].ok});
if(bad.length)o.push(`もう一度まちがえた問題が${bad.length}つあるよ。復習チャレンジで出すね。`);
const l=s.nt[s.nt.length-1],ng=l&&l.f.find(f=>/できなかった|次回/.test(f[0])&&f[1]);
if(ng)o.push(`前回のノートの「${ng[1]}」を、次の練習で意識してみよう。`);
if(!s.nt.length)o.push('練習ノートも書いてみよう。記録があるほど、アドバイスが具体的になるよ。');
if(s.n<10)o.push(`まだ${s.n}問の記録なので、くわしい分析は10問以上たまってからになるよ。`);
return o}
